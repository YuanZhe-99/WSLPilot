<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 160 160">
  <!-- WSLPilot app icon, source of resources/icon.png (go run ./tools/icon).
       The penguin is a flat redrawing after Tux by Larry Ewing
       (lewing@isc.tamu.edu) and The GIMP; see THIRD_PARTY_NOTICES.md. -->
  <!-- Tile -->
  <rect x="0" y="0" width="160" height="160" rx="36" fill="#0B5CD5"/>
  <!-- Window -->
  <rect x="16" y="18" width="128" height="104" rx="12" fill="#F4F6FA"/>
  <rect x="16" y="18" width="128" height="20" rx="12" fill="#D6E4FA"/>
  <rect x="16" y="30" width="128" height="8" fill="#D6E4FA"/>
  <path d="M106 28 H113 M120 24.5 H126.5 V31 H120 Z M133 24.5 L139 31 M139 24.5 L133 31"
        fill="none" stroke="#5A6B8C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Terminal -->
  <rect x="24" y="44" width="112" height="70" rx="6" fill="#1B1B1F"/>
  <path d="M34 54 L42 60 L34 66" fill="none" stroke="#F2A900" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="46" y="63" width="12" height="3.5" rx="1.75" fill="#F2A900"/>
  <!-- Containers -->
  <rect x="104" y="66" width="13" height="13" rx="2.5" fill="#3B8BFF"/>
  <rect x="119" y="66" width="13" height="13" rx="2.5" fill="#F2A900"/>
  <rect x="111.5" y="51" width="13" height="13" rx="2.5" fill="#F4F6FA"/>
  <!-- Penguin -->
  <g transform="translate(72 112)">
    <g fill="#F4F6FA" stroke="#F4F6FA" stroke-width="7" stroke-linejoin="round">
      <ellipse cx="-24" cy="2" rx="7" ry="17" transform="rotate(18 -24 2)"/>
      <ellipse cx="24" cy="2" rx="7" ry="17" transform="rotate(-18 24 2)"/>
      <ellipse cx="0" cy="4" rx="25" ry="30"/>
      <circle cx="0" cy="-24" r="17"/>
      <ellipse cx="-12" cy="33" rx="11" ry="5"/>
      <ellipse cx="12" cy="33" rx="11" ry="5"/>
    </g>
    <ellipse cx="-24" cy="2" rx="7" ry="17" transform="rotate(18 -24 2)" fill="#1B1B1F"/>
    <ellipse cx="24" cy="2" rx="7" ry="17" transform="rotate(-18 24 2)" fill="#1B1B1F"/>
    <ellipse cx="0" cy="4" rx="25" ry="30" fill="#1B1B1F"/>
    <circle cx="0" cy="-24" r="17" fill="#1B1B1F"/>
    <ellipse cx="0" cy="9" rx="17" ry="22" fill="#F4F6FA"/>
    <ellipse cx="-6" cy="-27" rx="4.5" ry="6" fill="#FFFFFF"/>
    <ellipse cx="6" cy="-27" rx="4.5" ry="6" fill="#FFFFFF"/>
    <circle cx="-5" cy="-26" r="2.3" fill="#1B1B1F"/>
    <circle cx="5" cy="-26" r="2.3" fill="#1B1B1F"/>
    <ellipse cx="0" cy="-17" rx="8" ry="4.5" fill="#F2A900"/>
    <ellipse cx="-12" cy="33" rx="11" ry="5" fill="#F2A900"/>
    <ellipse cx="12" cy="33" rx="11" ry="5" fill="#F2A900"/>
