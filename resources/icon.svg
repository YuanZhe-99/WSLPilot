<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 160 160">
  <!-- WSLPilot app icon: a plain penguin, drawn for WSLPilot (GPL-3.0).
       Source of resources/icon.png, internal/gui/appicon.png and
       cmd/wslpilot/tray.png (go run ./tools/icon). -->
  <g transform="translate(0 -7)">
  <!-- Feet -->
  <ellipse cx="60" cy="146" rx="17" ry="8" fill="#F59E0B"/>
  <ellipse cx="100" cy="146" rx="17" ry="8" fill="#F59E0B"/>
  <!-- Flippers -->
  <ellipse cx="34" cy="98" rx="11" ry="30" transform="rotate(18 34 98)" fill="#1F2937" stroke="#E5E7EB" stroke-width="3"/>
  <ellipse cx="126" cy="98" rx="11" ry="30" transform="rotate(-18 126 98)" fill="#1F2937" stroke="#E5E7EB" stroke-width="3"/>
  <!-- Body -->
  <ellipse cx="80" cy="88" rx="46" ry="58" fill="#1F2937" stroke="#E5E7EB" stroke-width="3"/>
  <!-- Flippers again, over the body's outline -->
  <ellipse cx="34" cy="98" rx="9.5" ry="28.5" transform="rotate(18 34 98)" fill="#1F2937"/>
  <ellipse cx="126" cy="98" rx="9.5" ry="28.5" transform="rotate(-18 126 98)" fill="#1F2937"/>
  <!-- Belly -->
  <ellipse cx="80" cy="104" rx="32" ry="40" fill="#F8FAFC"/>
  <!-- Face -->
  <ellipse cx="66" cy="62" rx="16" ry="18" fill="#F8FAFC"/>
  <ellipse cx="94" cy="62" rx="16" ry="18" fill="#F8FAFC"/>
  <!-- Eyes -->
  <circle cx="68" cy="60" r="7" fill="#111827"/>
  <circle cx="92" cy="60" r="7" fill="#111827"/>
  <circle cx="70.5" cy="57.5" r="2.4" fill="#FFFFFF"/>
  <circle cx="94.5" cy="57.5" r="2.4" fill="#FFFFFF"/>
  <!-- Beak -->
  <path d="M68 74 Q80 68 92 74 Q80 88 68 74 Z" fill="#F59E0B"/>
  </g>
</svg>
