name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # MyGo needs no cgo, so Ubuntu cross-builds both Windows architectures and
  # makes the NSIS installers, as Easytier-MyGo does.
  build:
    name: Windows packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install NSIS, for the installers
        run: sudo apt-get update && sudo apt-get install -y nsis zip

      - name: Build
        env:
          # Signs the app updates (archive, deltas and update-<target>.json);
          # unset, no updates are published.
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: scripts/build.sh windows/amd64 windows/arm64

      - name: Collect the downloads
        run: |
          mkdir -p dist
          version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)
          for arch in amd64 arm64; do
            # A portable folder next to the installer.
            (cd build && zip -qr "../dist/WSLPilot-$version-windows-$arch.zip" "windows-$arch" \
              -x '*setup*.exe' '*.tar.gz' '*.delta' '*/update-*.json')
          done
          find build -maxdepth 2 -type f \( -name '*setup*.exe' -o -name '*.tar.gz' -o -name '*.delta' \
            -o -name 'update-*.json' \) -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  # Only a tag publishes. Started by hand, the workflow builds the packages
  # and stops, leaving them as run artifacts.
  release:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag and the version agree
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
